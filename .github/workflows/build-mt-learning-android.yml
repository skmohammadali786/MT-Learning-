name: Build MT Learning Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-apps/**'
      - '.github/workflows/build-mt-learning-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [student, teacher, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        working-directory: mobile-apps/${{ matrix.app }}
        run: npm install --no-audit --no-fund
      - name: Add Android platform
        working-directory: mobile-apps/${{ matrix.app }}
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: mobile-apps/${{ matrix.app }}
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile-apps/${{ matrix.app }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mt-learning-${{ matrix.app }}-debug-apk
          path: mobile-apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
